<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Animated model pipeline: knee MRI slices are scanned, pass through a ConvNeXt CNN and attention pooling, and become probabilities for 12 knee abnormalities">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1424"/>
      <stop offset="1" stop-color="#151b30"/>
    </linearGradient>
    <radialGradient id="tissue" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#5b6478"/>
      <stop offset="1" stop-color="#1b2030"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#7c9cff"/>
    </linearGradient>
    <linearGradient id="scanGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="slice"><rect x="70" y="78" width="120" height="150" rx="8"/></clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #8b93a7; font-size: 12px; }
    .label { fill: #c9d1e3; font-size: 12px; }
    .head  { fill: #e6ebf5; font-size: 14px; font-weight: 600; }
    .scan { animation: scan 3s linear infinite; }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(150px); } }
    .dot { animation: flow 1.8s linear infinite; opacity: 0; }
    @keyframes flow { 0% { transform: translateX(0); opacity: 0; } 15%, 85% { opacity: 1; } 100% { transform: translateX(64px); opacity: 0; } }
    .fm { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    .att { transform-box: fill-box; transform-origin: bottom; animation: att 2.4s ease-in-out infinite alternate; }
    @keyframes att { from { transform: scaleY(.2); } to { transform: scaleY(1); } }
    .out { transform-box: fill-box; transform-origin: left; animation: fill 6s ease-out infinite; }
    @keyframes fill { 0% { transform: scaleX(0); } 40%, 88% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) { .scan, .dot, .fm, .att, .out { animation: none; opacity: 1; } }
  </style>

  <rect width="960" height="300" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="959" height="299" rx="16" fill="none" stroke="#2a3350"/>

  <text x="32" y="38" class="head">knee MRI → 12 findings</text>
  <text x="928" y="38" class="muted" text-anchor="end">2.5D CNN + attention-MIL · RSNA Kaggle 2026 · public LB <tspan fill="#2dd4bf" font-weight="600">0.916</tspan></text>

  <!-- 1. MRI slice stack, with a scan line sweeping the front slice -->
  <g>
    <rect x="94" y="62" width="120" height="150" rx="8" fill="#20263a" stroke="#323b58"/>
    <rect x="86" y="68" width="120" height="150" rx="8" fill="#232a40" stroke="#323b58"/>
    <rect x="78" y="73" width="120" height="150" rx="8" fill="#262e46" stroke="#323b58"/>
    <rect x="70" y="78" width="120" height="150" rx="8" fill="url(#tissue)" stroke="#3d4870"/>
    <g clip-path="url(#slice)">
      <!-- stylised sagittal knee: femur, tibia, patella and the joint space -->
      <path d="M105 78 C100 120 104 140 116 150 C126 158 146 158 156 150 C166 141 168 118 162 78 Z" fill="#9aa3b8" opacity=".55"/>
      <path d="M108 228 L112 172 C120 164 152 164 160 172 L166 228 Z" fill="#9aa3b8" opacity=".5"/>
      <ellipse cx="96" cy="140" rx="9" ry="17" fill="#b4bccd" opacity=".55"/>
      <path d="M114 160 C128 166 146 166 160 160" stroke="#e8f0ff" stroke-width="2.5" fill="none" opacity=".8"/>
      <rect class="scan" x="70" y="62" width="120" height="16" fill="url(#scanGlow)"/>
      <rect class="scan" x="70" y="77" width="120" height="1.5" fill="#2dd4bf"/>
    </g>
    <text x="130" y="252" class="muted" text-anchor="middle">3 planes × 32 slices</text>
  </g>

  <!-- flow 1 -->
  <g fill="#2dd4bf">
    <circle class="dot" cx="226" cy="150" r="3"/>
    <circle class="dot" cx="226" cy="150" r="3" style="animation-delay:.6s"/>
    <circle class="dot" cx="226" cy="150" r="3" style="animation-delay:1.2s"/>
  </g>

  <!-- 2. CNN feature maps -->
  <g>
    <rect class="fm" x="310" y="90"  width="22" height="120" rx="4" fill="#7c9cff"/>
    <rect class="fm" x="340" y="102" width="22" height="96"  rx="4" fill="#7c9cff" style="animation-delay:.3s"/>
    <rect class="fm" x="370" y="114" width="22" height="72"  rx="4" fill="#7c9cff" style="animation-delay:.6s"/>
    <rect class="fm" x="400" y="126" width="22" height="48"  rx="4" fill="#7c9cff" style="animation-delay:.9s"/>
    <text x="366" y="252" class="muted" text-anchor="middle">ConvNeXt-Tiny</text>
  </g>

  <!-- flow 2 -->
  <g fill="#7c9cff">
    <circle class="dot" cx="436" cy="150" r="3"/>
    <circle class="dot" cx="436" cy="150" r="3" style="animation-delay:.6s"/>
    <circle class="dot" cx="436" cy="150" r="3" style="animation-delay:1.2s"/>
  </g>

  <!-- 3. attention weights per slice -->
  <g fill="#2dd4bf">
    <rect class="att" x="520" y="110" width="9" height="100" rx="2"/>
    <rect class="att" x="533" y="110" width="9" height="100" rx="2" style="animation-delay:.4s;animation-duration:1.9s"/>
    <rect class="att" x="546" y="110" width="9" height="100" rx="2" style="animation-delay:.9s"/>
    <rect class="att" x="559" y="110" width="9" height="100" rx="2" style="animation-delay:.2s;animation-duration:2.8s"/>
    <rect class="att" x="572" y="110" width="9" height="100" rx="2" style="animation-delay:1.3s"/>
    <rect class="att" x="585" y="110" width="9" height="100" rx="2" style="animation-delay:.7s;animation-duration:2.1s"/>
    <rect class="att" x="598" y="110" width="9" height="100" rx="2" style="animation-delay:1.6s"/>
    <rect class="att" x="611" y="110" width="9" height="100" rx="2" style="animation-delay:.5s;animation-duration:3s"/>
    <text x="570" y="252" class="muted" text-anchor="middle">attention pooling</text>
  </g>

  <!-- flow 3 -->
  <g fill="#2dd4bf">
    <circle class="dot" cx="632" cy="150" r="3"/>
    <circle class="dot" cx="632" cy="150" r="3" style="animation-delay:.6s"/>
    <circle class="dot" cx="632" cy="150" r="3" style="animation-delay:1.2s"/>
  </g>

  <!-- 4. twelve output probabilities -->
  <g>
    <text x="702" y="74"  class="label">ACL</text>        <rect x="800" y="65"  width="128" height="10" rx="3" fill="#232a40"/><rect class="out" x="800" y="65"  width="105" height="10" rx="3" fill="url(#bar)"/>
    <text x="702" y="91"  class="label">MCL</text>        <rect x="800" y="82"  width="128" height="10" rx="3" fill="#232a40"/><rect class="out" x="800" y="82"  width="45"  height="10" rx="3" fill="url(#bar)" style="animation-delay:.1s"/>
    <text x="702" y="108" class="label">Med. menisc</text><rect x="800" y="99"  width="128" height="10" rx="3" fill="#232a40"/><rect class="out" x="800" y="99"  width="116" height="10" rx="3" fill="url(#bar)" style="animation-delay:.2s"/>
    <text x="702" y="125" class="label">Lat. menisc</text><rect x="800" y="116" width="128" height="10" rx="3" fill="#232a40"/><rect class="out" x="800" y="116" width="61"  height="10" rx="3" fill="url(#bar)" style="animation-delay:.3s"/>
    <text x="702" y="142" class="label">Medial OA</text>  <rect x="800" y="133" width="128" height="10" rx="3" fill="#232a40"/><rect class="out" x="800" y="133" width="95"  height="10" rx="3" fill="url(#bar)" style="animation-delay:.4s"/>
    <text x="702" y="159" class="label">Lateral OA</text> <rect x="800" y="150" width="128" height="10" rx="3" fill="#232a40"/><rect class="out" x="800" y="150" width="28"  height="10" rx="3" fill="url(#bar)" style="animation-delay:.5s"/>
    <text x="702" y="176" class="label">PF OA</text>      <rect x="800" y="167" width="128" height="10" rx="3" fill="#232a40"/><rect class="out" x="800" y="167" width="81"  height="10" rx="3" fill="url(#bar)" style="animation-delay:.6s"/>
    <text x="702" y="193" class="label">Effusion</text>   <rect x="800" y="184" width="128" height="10" rx="3" fill="#232a40"/><rect class="out" x="800" y="184" width="113" height="10" rx="3" fill="url(#bar)" style="animation-delay:.7s"/>
    <text x="702" y="210" class="label">Synovitis</text>  <rect x="800" y="201" width="128" height="10" rx="3" fill="#232a40"/><rect class="out" x="800" y="201" width="52"  height="10" rx="3" fill="url(#bar)" style="animation-delay:.8s"/>
    <text x="702" y="227" class="label">Baker's</text>    <rect x="800" y="218" width="128" height="10" rx="3" fill="#232a40"/><rect class="out" x="800" y="218" width="73"  height="10" rx="3" fill="url(#bar)" style="animation-delay:.9s"/>
    <text x="702" y="244" class="label">Contusion</text>  <rect x="800" y="235" width="128" height="10" rx="3" fill="#232a40"/><rect class="out" x="800" y="235" width="88"  height="10" rx="3" fill="url(#bar)" style="animation-delay:1s"/>
    <text x="702" y="261" class="label">Fracture</text>   <rect x="800" y="252" width="128" height="10" rx="3" fill="#232a40"/><rect class="out" x="800" y="252" width="15"  height="10" rx="3" fill="url(#bar)" style="animation-delay:1.1s"/>
  </g>
</svg>
